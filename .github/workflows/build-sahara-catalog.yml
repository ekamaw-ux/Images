name: Build Sahara photo catalogue

on:
  push:
    branches:
      - main
    paths:
      - 'sahara-catalog/package.json'
      - '.github/workflows/build-sahara-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out assets repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull catalogue renderer
        run: |
          mkdir -p sahara-catalog
          curl -fsSL "https://raw.githubusercontent.com/ekamaw-ux/Images/sahara-catalog-build/sahara-catalog/render.js" -o sahara-catalog/render.js

      - name: Install renderer
        working-directory: sahara-catalog
        run: |
          npm install --no-audit --no-fund
          npm install pdf-lib@1.17.1 --no-save --no-audit --no-fund

      - name: Build PDF with live Shopify images and prices
        working-directory: sahara-catalog
        run: npm run build

      - name: Compress catalogue for easy sharing
        working-directory: sahara-catalog
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');
          const puppeteer = require('puppeteer');
          const { PDFDocument } = require('pdf-lib');

          (async () => {
            const htmlPath = path.join(process.cwd(), 'catalogue-preview.html');
            const outputPath = path.join(process.cwd(), 'Sahara_Product_Catalogue_With_Photos.pdf');
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
            });
            try {
              const page = await browser.newPage();
              await page.setViewport({ width: 900, height: 1250, deviceScaleFactor: 1.35 });
              await page.goto(pathToFileURL(htmlPath).href, { waitUntil: 'networkidle0', timeout: 180000 });
              await page.evaluate(async () => {
                await Promise.all(Array.from(document.images).map((image) => {
                  if (image.complete) return image.decode?.().catch(() => undefined);
                  return new Promise((resolve) => {
                    image.addEventListener('load', resolve, { once: true });
                    image.addEventListener('error', resolve, { once: true });
                  });
                }));
              });
              await new Promise((resolve) => setTimeout(resolve, 1500));

              const elements = await page.$$('.page');
              const pdf = await PDFDocument.create();
              pdf.setTitle('Sahara Product Catalogue');
              pdf.setAuthor('Sahara Shopping');
              pdf.setSubject('Current Sahara retail catalogue with product photography and prices in AED');
              const a4 = [595.28, 841.89];

              for (const element of elements) {
                const jpeg = await element.screenshot({ type: 'jpeg', quality: 70, captureBeyondViewport: true });
                const image = await pdf.embedJpg(jpeg);
                const pdfPage = pdf.addPage(a4);
                pdfPage.drawImage(image, { x: 0, y: 0, width: a4[0], height: a4[1] });
              }

              const bytes = await pdf.save({ useObjectStreams: true });
              fs.writeFileSync(outputPath, bytes);
              console.log(`Compressed catalogue: ${elements.length} pages, ${Math.round(bytes.length / 1024 / 1024 * 10) / 10} MB`);
            } finally {
              await browser.close();
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Split catalogue into retrievable page PDFs
        working-directory: sahara-catalog
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { PDFDocument } = require('pdf-lib');
          (async () => {
            const sourcePath = path.join(process.cwd(), 'Sahara_Product_Catalogue_With_Photos.pdf');
            const sourceBytes = fs.readFileSync(sourcePath);
            const source = await PDFDocument.load(sourceBytes);
            const outputDir = path.join(process.cwd(), 'pages');
            fs.rmSync(outputDir, { recursive: true, force: true });
            fs.mkdirSync(outputDir, { recursive: true });
            const pages = [];
            for (let index = 0; index < source.getPageCount(); index += 1) {
              const doc = await PDFDocument.create();
              const [page] = await doc.copyPages(source, [index]);
              doc.addPage(page);
              const bytes = await doc.save({ useObjectStreams: true });
              const name = `page-${String(index + 1).padStart(3, '0')}.pdf`;
              fs.writeFileSync(path.join(outputDir, name), bytes);
              pages.push({ name, bytes: bytes.length });
            }
            fs.writeFileSync(path.join(outputDir, 'manifest.json'), JSON.stringify({
              pageCount: pages.length,
              sourceBytes: sourceBytes.length,
              pages,
            }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sahara_Product_Catalogue_With_Photos
          path: sahara-catalog/Sahara_Product_Catalogue_With_Photos.pdf
          retention-days: 7

      - name: Commit generated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sahara-catalog/Sahara_Product_Catalogue_With_Photos.pdf sahara-catalog/catalogue-preview.html sahara-catalog/pages
          if git diff --cached --quiet; then
            echo "Catalogue unchanged"
          else
            git commit -m "Generate Sahara product catalogue with store photos"
            git push origin HEAD:main
          fi
